<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VAULT-5 // STORY MAP</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040c04;
  --panel: #081008;
  --border: #1a4d1a;
  --green: #39ff14;
  --green-dim: #0f5a06;
  --amber: #ffb300;
  --text: #9ddd9d;
  --text-dim: #3a6b3a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* CRT scanlines */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.12) 3px,rgba(0,0,0,0.12) 4px);
  pointer-events: none;
  z-index: 900;
}

#toolbar {
  background: var(--panel);
  border-bottom: 2px solid var(--border);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  min-height: 50px;
  flex-shrink: 0;
}

#title {
  font-family: 'VT323', monospace;
  font-size: 24px;
  color: var(--green);
  text-shadow: 0 0 12px var(--green), 0 0 25px rgba(57,255,20,0.3);
  letter-spacing: 3px;
  white-space: nowrap;
  user-select: none;
}

.sep { color: var(--border); font-size: 18px; }

.file-label {
  cursor: pointer;
  border: 1px solid var(--green);
  color: var(--green);
  padding: 5px 14px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px;
  background: transparent;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 1px;
}
.file-label:hover {
  background: var(--green);
  color: #000;
  box-shadow: 0 0 14px rgba(57,255,20,0.5);
}
#file-input { display: none; }

#status {
  font-size: 11px;
  color: var(--text-dim);
  flex: 1;
  min-width: 160px;
}
#status .ok  { color: var(--green); }
#status .err { color: #ff4444; }

#legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.leg { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-dim); white-space: nowrap; }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

#controls { display: flex; gap: 6px; }
.ctrl-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 1px;
}
.ctrl-btn:hover { border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(57,255,20,0.2); }

#svg-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: grab;
}
#svg-wrap:active { cursor: grabbing; }

svg { width: 100%; height: 100%; display: block; }

/* Nodes */
.node-rect {
  cursor: pointer;
  transition: filter 0.15s;
}
.node-g:hover .node-rect { filter: brightness(1.35) drop-shadow(0 0 6px currentColor); }
.node-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 7.5px;
  fill: rgba(0,0,0,0.85);
  pointer-events: none;
  dominant-baseline: middle;
  text-anchor: middle;
  font-weight: bold;
  letter-spacing: 0.3px;
}
.node-icon {
  font-size: 9px;
  fill: rgba(0,0,0,0.6);
  pointer-events: none;
  dominant-baseline: middle;
  text-anchor: middle;
}

/* Edges */
.edge { fill: none; stroke-width: 1.3; }
.edge-cond { stroke-dasharray: 5,3; }

/* Section labels */
.band-label {
  font-family: 'VT323', monospace;
  font-size: 12px;
  dominant-baseline: middle;
  pointer-events: none;
  letter-spacing: 2px;
  opacity: 0.35;
}

/* Placeholder */
#placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  pointer-events: none;
}
#placeholder .big {
  font-family: 'VT323', monospace;
  font-size: 32px;
  color: var(--border);
  text-shadow: 0 0 8px var(--green-dim);
  letter-spacing: 4px;
  animation: blink 2s step-end infinite;
}
#placeholder .small { font-size: 11px; color: var(--text-dim); }
@keyframes blink { 50% { opacity: 0.3; } }

/* Tooltip */
#tooltip {
  position: fixed;
  background: rgba(4,12,4,0.97);
  border: 1px solid var(--border);
  border-left: 2px solid var(--green);
  padding: 10px 14px;
  font-size: 11px;
  max-width: 310px;
  pointer-events: none;
  display: none;
  z-index: 950;
  line-height: 1.7;
  box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 40px rgba(57,255,20,0.02);
}
.tt-id { font-size: 14px; font-family: 'VT323', monospace; letter-spacing: 2px; margin-bottom: 4px; }
.tt-section { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
.tt-content { color: #7aaa7a; font-size: 10px; line-height: 1.6; }
.tt-meta { margin-top: 6px; font-size: 10px; color: var(--text-dim); }
.tt-tag { display: inline-block; margin-right: 8px; }
.tt-warn { color: var(--amber); }
.tt-special { color: #00e5ff; }

/* Edge hint */
.edge-hint {
  font-size: 7px;
  fill: var(--text-dim);
  pointer-events: none;
  dominant-baseline: middle;
  text-anchor: middle;
}
</style>
</head>
<body>

<div id="toolbar">
  <div id="title">VAULT-5 // STORY MAP</div>
  <span class="sep">|</span>
  <label class="file-label" for="file-input">[ LOAD game.js ]</label>
  <input type="file" id="file-input" accept=".js,.txt">
  <div id="status">Awaiting data file&hellip;</div>
  <div id="legend"></div>
  <div id="controls">
    <button class="ctrl-btn" id="btn-fit">[ FIT VIEW ]</button>
  </div>
</div>

<div id="svg-wrap">
  <div id="placeholder">
    <div class="big">// AWAITING INPUT //</div>
    <div class="small">Load your game.js to generate the node map</div>
  </div>
  <svg id="graph"></svg>
</div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
// ═══════════════════════════════════════════════
// SECTION PARSER
// Reads "// I. Vault", "// II. First Hub" etc.
// Maps each node_id to its section automatically
// ═══════════════════════════════════════════════
function parseSections(code) {
  const lines = code.split('\n');
  const sectionMap = {};   // nodeId → { name, index }
  const sectionList = [];  // ordered list of sections
  let curSec = { name: 'Unknown', index: 0 };

  const secRe = /\/\/\s+([IVX]+\.\s+[\w\s&'-]+?)(?:\s*$)/;
  const nodeRe = /["']([a-z][a-z0-9_]*)["']\s*:\s*\{/;

  for (const line of lines) {
    const sm = line.match(secRe);
    if (sm) {
      const name = sm[1].trim();
      const existing = sectionList.find(s => s.name === name);
      if (!existing) {
        curSec = { name, index: sectionList.length + 1 };
        sectionList.push(curSec);
      } else {
        curSec = existing;
      }
    }
    const nm = line.match(nodeRe);
    if (nm && !sectionMap[nm[1]]) {
      sectionMap[nm[1]] = { ...curSec };
    }
  }
  return { sectionMap, sectionList };
}

// ═══════════════════════════════════════════════
// SYNTAX FIXER
// Auto-repairs missing commas between object
// entries that JS sections comments can mask
// e.g.  }          }
//       // comment  →  },
//       "nextKey":     "nextKey":
// ═══════════════════════════════════════════════
function fixSyntax(code) {
  // Insert missing comma between closing } of one entry and opening " of next key
  // Pattern: }  <optional whitespace/comments>  "someKey" :
  return code.replace(
    /(\})\s*((?:\/\/[^\n]*\n\s*)*)\s*("(?:[a-z][a-z0-9_]*)")\s*:/g,
    (match, brace, mid, key) => {
      // Only fix if no comma already
      const trimmed = mid.trimStart();
      return `${brace},\n    ${trimmed}${key}:`;
    }
  );
}

// ═══════════════════════════════════════════════
// STORY DATA EXTRACTOR
// Safely eval's game.js with a mocked DOM
// ═══════════════════════════════════════════════
function extractStoryData(code) {
  // First attempt: raw code
  const attempt = (src) => {
    try {
      const mockEl = () => ({
        innerText: '', innerHTML: '', value: '', style: {},
        classList: { add:()=>{}, remove:()=>{}, contains:()=>false },
        appendChild: ()=>{}, addEventListener: ()=>{},
        closest: ()=>null, getAttribute: ()=>null,
        removeEventListener: ()=>{}
      });
      const mockDoc = {
        addEventListener: ()=>{},
        getElementById: ()=>mockEl(),
        createElement: ()=>mockEl(),
        querySelectorAll: ()=>[],
      };
      const mockStorage = { getItem:()=>null, setItem:()=>{}, removeItem:()=>{} };
      const mockFetch = () => Promise.resolve({ ok: false, json: ()=>Promise.resolve({}) });
      const fn = new Function('document','localStorage','window','fetch',
        '"use strict";\n' + src + '\nreturn (typeof storyData !== "undefined") ? storyData : null;'
      );
      return fn(mockDoc, mockStorage, { addEventListener:()=>{}, localStorage: mockStorage }, mockFetch);
    } catch(e) {
      return { error: e };
    }
  };

  let result = attempt(code);
  if (result && !result.error) return result;

  // Second attempt: apply syntax fixer
  console.warn('First parse failed, attempting syntax repair…', result.error);
  const fixed = fixSyntax(code);
  result = attempt(fixed);
  if (result && !result.error) return result;

  console.error('Extraction failed after repair:', result.error);
  return null;
}

// ═══════════════════════════════════════════════
// BFS LEVEL ASSIGNMENT
// ═══════════════════════════════════════════════
function computeLevels(nodes, edges) {
  const adj = {};
  for (const n of nodes) adj[n.id] = [];
  for (const e of edges) {
    if (adj[e.from] && !adj[e.from].includes(e.to)) adj[e.from].push(e.to);
  }
  const levels = {};
  const startId = nodes[0]?.id;
  if (!startId) return levels;
  levels[startId] = 0;
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    for (const nxt of (adj[cur] || [])) {
      if (levels[nxt] === undefined) {
        levels[nxt] = levels[cur] + 1;
        queue.push(nxt);
      }
    }
  }
  const maxL = Math.max(0, ...Object.values(levels));
  for (const n of nodes) {
    if (levels[n.id] === undefined) levels[n.id] = maxL + 1;
  }
  return levels;
}

// ═══════════════════════════════════════════════
// COLOR PALETTE (terminal aesthetic)
// ═══════════════════════════════════════════════
const PALETTE = [
  '#39ff14', // 1 – Vault (phosphor green)
  '#00e5ff', // 2 – First Hub (cyan)
  '#fff176', // 3 – Interlude (pale yellow)
  '#ffb300', // 4 – Second Hub (amber)
  '#ff6b6b', // 5 – Depot (red)
  '#ce93d8', // 6 – Resolution (purple)
  '#80cbc4', // 7+
  '#a5d6a7',
  '#ffcc80',
];
function secColor(idx) {
  if (!idx || idx === 0) return '#546e7a';
  return PALETTE[(idx - 1) % PALETTE.length];
}

// ═══════════════════════════════════════════════
// RECT EDGE INTERSECTION
// Returns the point on the rectangle border where
// a line from (sx,sy) to (tx,ty) exits
// ═══════════════════════════════════════════════
function rectEdge(sx, sy, tx, ty, hw, hh) {
  const dx = tx - sx, dy = ty - sy;
  if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return [tx, ty];
  const scaleX = dx !== 0 ? hw / Math.abs(dx) : Infinity;
  const scaleY = dy !== 0 ? hh / Math.abs(dy) : Infinity;
  const scale = Math.min(scaleX, scaleY);
  return [tx - dx * scale, ty - dy * scale];
}
function rectEdgeFrom(sx, sy, tx, ty, hw, hh) {
  return rectEdge(tx, ty, sx, sy, hw, hh);
}

// ═══════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════
let sim = null;

function renderGraph(storyData, sectionMap, sectionList) {
  if (sim) { sim.stop(); sim = null; }
  const svg = d3.select('#graph');
  svg.selectAll('*').remove();
  document.getElementById('placeholder').style.display = 'none';

  const W = document.getElementById('svg-wrap').offsetWidth;
  const H = document.getElementById('svg-wrap').offsetHeight;

  // Pre-scan: find self-loop nodes (rest/train actions that target themselves)
  const selfLoopNodes = new Set();
  for (const node of Object.values(storyData)) {
    for (const ch of (node.choices || [])) {
      if (ch.target && ch.target === node.id) selfLoopNodes.add(node.id);
    }
  }

  // Build node list (hasLoop now available)
  const nodes = Object.values(storyData).map(n => ({
    id: n.id,
    content: n.content || '',
    section: sectionMap[n.id]?.index ?? 0,
    sectionName: sectionMap[n.id]?.name ?? '?',
    isLogic: !!n.isLogicNode,
    isDynamic: !!n.isDynamic,
    isGameOver: n.id.startsWith('game_over'),
    daysCost: n.daysCost ?? 0,
    hpChange: n.hpChange ?? 0,
    choiceCount: (n.choices || []).length,
    hasLoop: selfLoopNodes.has(n.id),
  }));

  // Build edge list — self-loops excluded (shown as node badge instead)
  const rawEdges = [];
  for (const node of Object.values(storyData)) {
    for (const ch of (node.choices || [])) {
      if (!ch.target || ch.target === 'RESTART') continue;
      if (ch.target === node.id) continue; // self-loop: skip arrow
      rawEdges.push({
        from: node.id,
        to: ch.target,
        text: ch.text || '',
        // conditional: stat check (simple or "or"), flag check
        conditional: !!ch.condition,
      });
    }
  }

  // BFS levels & initial positions
  const levels = computeLevels(nodes, rawEdges);
  const maxLevel = Math.max(...Object.values(levels));

  const byLevel = {};
  for (const n of nodes) {
    const l = levels[n.id] ?? maxLevel;
    n.level = l;
    if (!byLevel[l]) byLevel[l] = [];
    byLevel[l].push(n);
  }

  const PAD_X = 80, PAD_Y = 55;
  const levelH = (H - PAD_Y * 2) / (maxLevel + 1);

  for (const [lStr, ns] of Object.entries(byLevel)) {
    const l = parseInt(lStr);
    const gap = (W - PAD_X * 2) / (ns.length + 1);
    ns.forEach((n, i) => {
      n.x = PAD_X + gap * (i + 1);
      n.y = PAD_Y + l * levelH;
    });
  }

  // Node size
  const NW = 92, NH = 22;

  // ── SVG structure ──
  const defs = svg.append('defs');

  // Arrowheads
  function mkArrow(id, color) {
    defs.append('marker')
      .attr('id', id)
      .attr('viewBox', '0 -4 8 8')
      .attr('refX', 7).attr('refY', 0)
      .attr('markerWidth', 5).attr('markerHeight', 5)
      .attr('orient', 'auto')
      .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', color);
  }
  mkArrow('arr', '#2d6e2d');
  mkArrow('arr-cond', '#ffb300');
  mkArrow('arr-go', '#884444');

  // Zoom container
  const root = svg.append('g').attr('id', 'root');
  const zoomBehavior = d3.zoom().scaleExtent([0.08, 5])
    .on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoomBehavior);

  // Section band backgrounds
  const bandG = root.append('g');
  const secInfo = {};
  for (const n of nodes) {
    const k = n.sectionName;
    if (!secInfo[k]) secInfo[k] = { min: Infinity, max: -Infinity, idx: n.section };
    secInfo[k].min = Math.min(secInfo[k].min, n.level);
    secInfo[k].max = Math.max(secInfo[k].max, n.level);
  }
  const BW = W * 4;
  for (const [name, info] of Object.entries(secInfo)) {
    const y1 = PAD_Y + info.min * levelH - levelH * 0.52;
    const y2 = PAD_Y + info.max * levelH + levelH * 0.52;
    const col = secColor(info.idx);
    bandG.append('rect')
      .attr('x', -BW/2).attr('y', y1)
      .attr('width', BW).attr('height', y2 - y1)
      .attr('fill', col).attr('opacity', 0.028);
    bandG.append('line')
      .attr('x1', -BW/2).attr('x2', BW/2)
      .attr('y1', y1).attr('y2', y1)
      .attr('stroke', col).attr('stroke-width', 0.5).attr('opacity', 0.18);
    bandG.append('text')
      .attr('class', 'band-label')
      .attr('x', 12).attr('y', (y1 + y2) / 2)
      .attr('fill', col).attr('font-size', 11)
      .attr('font-family', '"VT323", monospace')
      .text('// ' + name.toUpperCase());
  }

  // Edge layer
  const edgeLayer = root.append('g');
  // Node layer
  const nodeLayer = root.append('g');

  // D3 link data (will be mutated by forceLink)
  const links = rawEdges.map(e => ({
    ...e, source: e.from, target: e.to
  }));

  // Draw edges
  const edgePaths = edgeLayer.selectAll('path')
    .data(links)
    .join('path')
    .attr('class', d => 'edge' + (d.conditional ? ' edge-cond' : ''))
    .attr('stroke', d => d.conditional ? '#ffb300' : d.from?.startsWith?.('game_over') ? '#884444' : '#2d6e2d')
    .attr('stroke-width', d => d.conditional ? 1.5 : 1.3)
    .attr('stroke-dasharray', d => d.conditional ? '5,3' : null)
    .attr('fill', 'none')
    .attr('opacity', 0.65)
    .attr('marker-end', d => d.conditional ? 'url(#arr-cond)' : 'url(#arr)');

  // Draw nodes
  const nodeGroups = nodeLayer.selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node-g')
    .call(d3.drag()
      .on('start', (ev, d) => { if (!ev.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end',   (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    )
    .on('mouseover', (ev, d) => showTT(ev, d))
    .on('mousemove', ev => moveTT(ev))
    .on('mouseout', hideTT);

  // Node rectangle
  nodeGroups.append('rect')
    .attr('class', 'node-rect')
    .attr('width', NW).attr('height', NH)
    .attr('x', -NW/2).attr('y', -NH/2)
    .attr('rx', 2)
    .attr('fill', d => secColor(d.section))
    .attr('stroke', d => {
      if (d.isGameOver) return '#cc2222';
      if (d.isLogic)    return '#ffff00';
      if (d.isDynamic)  return '#00ff88';
      return 'rgba(0,0,0,0.5)';
    })
    .attr('stroke-width', d => (d.isLogic || d.isDynamic || d.isGameOver) ? 2 : 1)
    .attr('fill-opacity', 0.88);

  // Node label (truncated)
  nodeGroups.append('text')
    .attr('class', 'node-label')
    .attr('dy', '0.1em')
    .text(d => {
      const s = d.id;
      return s.length <= 14 ? s : s.substring(0, 13) + '…';
    });

  // Special icon overlay (right side of node)
  nodeGroups.filter(d => d.daysCost > 0 || d.hpChange < 0)
    .append('text')
    .attr('class', 'node-icon')
    .attr('x', NW/2 - 7)
    .attr('y', -NH/2 + 6)
    .attr('font-size', '7px')
    .attr('fill', '#000')
    .attr('opacity', 0.5)
    .attr('text-anchor', 'end')
    .attr('dominant-baseline', 'hanging')
    .text(d => {
      let s = '';
      if (d.daysCost > 0) s += '⏱';
      if (d.hpChange < 0) s += '♥';
      return s;
    });

  // Self-loop badge (↺ icon on nodes with rest/train in-place actions)
  nodeGroups.filter(d => d.hasLoop)
    .append('text')
    .attr('x', -NW/2 + 5)
    .attr('y', -NH/2 + 5)
    .attr('font-size', '9px')
    .attr('fill', '#000')
    .attr('opacity', 0.55)
    .attr('dominant-baseline', 'hanging')
    .attr('text-anchor', 'start')
    .attr('pointer-events', 'none')
    .text('↺');

  // ── Simulation ──
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(75).strength(0.18))
    .force('charge', d3.forceManyBody().strength(-220))
    .force('x', d3.forceX(d => d.x).strength(0.1))
    .force('y', d3.forceY(d => d.y).strength(0.92))
    .force('collide', d3.forceCollide(52))
    .alphaDecay(0.018)
    .on('tick', tick);

  function edgePath(d) {
    const sx = d.source.x ?? 0, sy = d.source.y ?? 0;
    const tx = d.target.x ?? 0, ty = d.target.y ?? 0;

    // Intersect with source/target rects
    const [x1, y1] = rectEdgeFrom(sx, sy, tx, ty, NW/2, NH/2);
    const [x2, y2] = rectEdge(sx, sy, tx, ty, NW/2 + 2, NH/2 + 2);

    const dx = tx - sx, dy = ty - sy;
    // Slight curve perpendicular to the edge
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const bend = Math.min(30, len * 0.18);
    const mx = (x1 + x2) / 2 + (dy / len) * bend * (Math.random() > 0.5 ? 1 : -1 );
    const my = (y1 + y2) / 2 - (dx / len) * bend * (Math.random() > 0.5 ? 1 : -1 );

    return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
  }

  // Precompute stable bend directions per edge to avoid flickering
  links.forEach(l => {
    l._bend = (Math.random() > 0.5 ? 1 : -1);
  });

  function edgePathStable(d) {
    const sx = d.source.x ?? 0, sy = d.source.y ?? 0;
    const tx = d.target.x ?? 0, ty = d.target.y ?? 0;
    const [x1, y1] = rectEdgeFrom(sx, sy, tx, ty, NW/2, NH/2);
    const [x2, y2] = rectEdge(sx, sy, tx, ty, NW/2 + 2, NH/2 + 2);
    const dx = tx - sx, dy = ty - sy;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const bend = Math.min(28, len * 0.15) * d._bend;
    const mx = (x1 + x2) / 2 + (dy / len) * bend;
    const my = (y1 + y2) / 2 - (dx / len) * bend;
    return `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
  }

  function tick() {
    edgePaths.attr('d', edgePathStable);
    nodeGroups.attr('transform', d => `translate(${d.x},${d.y})`);
  }

  // ── Legend ──
  const legendDiv = document.getElementById('legend');
  legendDiv.innerHTML = '';
  for (const sec of sectionList) {
    const el = document.createElement('div');
    el.className = 'leg';
    el.innerHTML = `<div class="leg-dot" style="background:${secColor(sec.index)}"></div><span>${sec.name}</span>`;
    legendDiv.appendChild(el);
  }
  // Game Over entry
  const go = document.createElement('div');
  go.className = 'leg';
  go.innerHTML = `<div class="leg-dot" style="background:#546e7a"></div><span>Game Over</span>`;
  legendDiv.appendChild(go);
  // Conditional edge entry
  const ce = document.createElement('div');
  ce.className = 'leg';
  ce.innerHTML = `<div class="leg-dot" style="background:#ffb300;border-radius:0"></div><span>Conditional / OR path</span>`;
  legendDiv.appendChild(ce);
  // Self-loop entry
  const le = document.createElement('div');
  le.className = 'leg';
  le.innerHTML = `<span style="font-size:11px;margin-right:4px;opacity:0.7">↺</span><span>In-place action</span>`;
  legendDiv.appendChild(le);

  // ── Status ──
  const cond = rawEdges.filter(e => e.conditional).length;
  document.getElementById('status').innerHTML =
    `<span class="ok">✓</span> ${nodes.length} nodes &middot; ${rawEdges.length} paths &middot; ${cond} conditional &middot; ${selfLoopNodes.size} in-place`;

  // ── Fit ──
  setTimeout(fitView, 1400);
  document.getElementById('btn-fit').onclick = fitView;

  function fitView() {
    try {
      const bbox = root.node().getBBox();
      if (!bbox.width || !bbox.height) return;
      const pad = 48;
      const scaleX = W / (bbox.width + pad * 2);
      const scaleY = H / (bbox.height + pad * 2);
      const scale = Math.min(scaleX, scaleY, 2);
      const tx = W / 2 - scale * (bbox.x + bbox.width / 2);
      const ty = H / 2 - scale * (bbox.y + bbox.height / 2);
      svg.transition().duration(600)
        .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    } catch(e) {}
  }
}

// ═══════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════
function showTT(ev, d) {
  const tt = document.getElementById('tooltip');
  const col = secColor(d.section);
  let html = `<div class="tt-id" style="color:${col};text-shadow:0 0 8px ${col}">${d.id}</div>`;
  html += `<div class="tt-section">${d.sectionName}</div>`;
  if (d.content) {
    const stripped = d.content.replace(/\[[\w_]+\]\s*/g, '').trim();
    const preview = stripped.substring(0, 160) + (stripped.length > 160 ? '…' : '');
    html += `<div class="tt-content">${preview}</div>`;
  }
  const tags = [];
  if (d.daysCost > 0) tags.push(`<span class="tt-tag tt-warn">⏱ -${d.daysCost} day${d.daysCost > 1 ? 's' : ''}</span>`);
  if (d.hpChange < 0) tags.push(`<span class="tt-tag tt-warn">❤ ${d.hpChange} HP</span>`);
  if (d.choiceCount > 0) tags.push(`<span class="tt-tag">${d.choiceCount} choice${d.choiceCount > 1 ? 's' : ''}</span>`);
  if (d.hasLoop)    tags.push(`<span class="tt-tag tt-special">↺ In-place action (rest/train)</span>`);
  if (d.isLogic)    tags.push(`<span class="tt-tag tt-special">⚙ Logic node</span>`);
  if (d.isDynamic)  tags.push(`<span class="tt-tag tt-special">✦ Dynamic</span>`);
  if (d.isGameOver) tags.push(`<span class="tt-tag" style="color:#ff4444">💀 Game Over</span>`);
  if (tags.length) html += `<div class="tt-meta">${tags.join('')}</div>`;
  tt.innerHTML = html;
  tt.style.display = 'block';
  moveTT(ev);
}
function moveTT(ev) {
  const tt = document.getElementById('tooltip');
  let x = ev.clientX + 16, y = ev.clientY + 12;
  if (x + 320 > window.innerWidth)  x = ev.clientX - 326;
  if (y + 200 > window.innerHeight) y = ev.clientY - 210;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}
function hideTT() {
  document.getElementById('tooltip').style.display = 'none';
}

// ═══════════════════════════════════════════════
// FILE LOAD
// ═══════════════════════════════════════════════
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('status').innerHTML = 'Loading…';
  const reader = new FileReader();
  reader.onload = ev => {
    const code = ev.target.result;
    const { sectionMap, sectionList } = parseSections(code);
    const storyData = extractStoryData(code);
    if (!storyData) {
      document.getElementById('status').innerHTML =
        '<span class="err">✗ Could not parse storyData — check console for details.</span>';
      return;
    }
    renderGraph(storyData, sectionMap, sectionList);
  };
  reader.readAsText(file);
  e.target.value = ''; // allow reloading same file
});
</script>
